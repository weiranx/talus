# The Talus engine on the droplet. nginx on the host sends https://talus.weiranxiong.com/api/* to
# 127.0.0.1:3021; the pages are served by the Cloudflare Worker in web/ (see README).
name: talus
services:
  engine:
    build: { context: .., dockerfile: deploy/engine.Dockerfile }
    image: talus-engine
    env_file: .env
    environment:
      TALUS_DATA_DIR: /data
      TALUS_REVISION: ${TALUS_REVISION:-unknown}
      TZ: ${TALUS_TZ:-America/Los_Angeles}
    volumes:
      - ${TALUS_DATA_PATH:-./data}:/data
    ports:
      - "127.0.0.1:${TALUS_ENGINE_PORT:-3021}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
