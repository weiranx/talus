# /etc/nginx/sites-available/talus, symlinked into sites-enabled.
# Cloudflare proxies the hostname (SSL mode Full (strict)); the origin cert comes from certbot.
server {
    listen 80;
    server_name talus.weiranxiong.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name talus.weiranxiong.com;

    ssl_certificate     /etc/letsencrypt/live/talus.weiranxiong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talus.weiranxiong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;

    # Apple Health export.zip uploads can be large and slow to read.
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
