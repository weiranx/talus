[project]
name = "talus-engine"
version = "0.1.0"
description = "Talus load engine: sync, parse and score mountain activities"
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.10",
    "numpy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=1",
    "cryptography>=42",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
garmin = ["garminconnect>=0.3.17"]

[project.scripts]
talus = "talus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fit-tool>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
